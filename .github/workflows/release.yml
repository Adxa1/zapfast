name: Release

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.2.3)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Baked into the binary by settings.rs; releases built without the
  # secret simply ship keyless and the picker asks for one.
  ZAPFAST_GIPHY_KEY: ${{ secrets.ZAPFAST_GIPHY_KEY || secrets.FASTSAPP_GIPHY_KEY }}

# ---------------------------------------------------------------------------
# Prepare release
#
# For a normal tag push:
#   v1.2.3 already exists, so nothing is created.
#
# For "Run workflow":
#   create v1.2.3 from the current branch/commit, then all build jobs
#   checkout that exact tag.
# ---------------------------------------------------------------------------
jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare release tag
        id: release
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"

            # Allow both:
            #   1.2.3
            #   v1.2.3
            version="${version#v}"

            if [ -z "$version" ]; then
              echo "Version cannot be empty."
              exit 1
            fi

            tag="v${version}"

            echo "Requested release tag: $tag"

            # Make sure the tag doesn't already exist.
            if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
              echo "Tag ${tag} already exists."
              echo "Choose a different version."
              exit 1
            fi

            # Create the release tag from the commit that triggered
            # the manual workflow.
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git tag "$tag" "$GITHUB_SHA"
            git push origin "$tag"

            echo "Created and pushed tag: $tag"
          else
            tag="$REF_NAME"

            if [[ ! "$tag" =~ ^v.+ ]]; then
              echo "Invalid release tag: $tag"
              exit 1
            fi

            version="${tag#v}"

            echo "Using existing tag: $tag"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          echo "Release tag: $tag"
          echo "Release version: $version"

  # -------------------------------------------------------------------------
  # Linux / Windows builds
  # -------------------------------------------------------------------------
  build:
    name: build (${{ matrix.target }})
    needs: prepare

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu

          # Native ARM64 runner, so the GUI's system libraries need no
          # cross-compilation sysroot.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu

          - os: windows-latest
            target: x86_64-pc-windows-msvc

          # Cross-compiled from x64; the MSVC ARM64 linker ships with
          # the runner's Visual Studio installation.
          - os: windows-latest
            target: aarch64-pc-windows-msvc

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # The repository pins its toolchain; add the cross-target's standard
      # library to the toolchain the pin actually resolves to.
      - run: rustup target add ${{ matrix.target }}

      - name: GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev \
            libwayland-dev \
            libgl1-mesa-dev \
            libasound2-dev \
            cmake \
            perl

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail

          name="zapfast-${RELEASE_TAG}-${{ matrix.target }}"

          mkdir -p "dist/$name"

          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/zapfast.exe" \
              "dist/$name/"
          else
            cp "target/${{ matrix.target }}/release/zapfast" \
              "dist/$name/"
          fi

          cp README.md LICENSE packaging/zapfast-portable.txt \
            "dist/$name/"

          if [ "${{ runner.os }}" = "Linux" ]; then
            # Desktop integration for package builds and hand-installs.
            cp --parents \
              packaging/applications/zapfast.desktop \
              packaging/icons/zapfast.svg \
              contrib/omarchy/zapfast.json.tpl \
              contrib/omarchy/zapfast-theme \
              "dist/$name/"
          fi

          cd dist

          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$name.zip" "$name"
          else
            tar czf "$name.tar.gz" "$name"
          fi

      # Inno Setup ships with the Windows runner image.
      # PowerShell is used because bash on Windows rewrites /D... arguments
      # as paths.
      - name: Installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $version = $env:RELEASE_VERSION
          $arch = "${{ matrix.target }}".Split("-")[0]

          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source

          if (-not $iscc) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }

          if (-not (Test-Path $iscc)) {
            Write-Error "Inno Setup compiler was not found."
            exit 1
          }

          & $iscc `
            "/DVersion=$version" `
            "/DArch=$arch" `
            "/DBinary=$PWD\target\${{ matrix.target }}\release\zapfast.exe" `
            "/DOutputDir=$PWD\dist" `
            packaging\windows\zapfast.iss

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*-setup.exe
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # macOS universal build
  # -------------------------------------------------------------------------
  macos:
    name: macOS universal app
    needs: prepare

    runs-on: macos-latest

    env:
      # Complete Apple credentials enable native-packages signing/notarization.
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-universal

      - name: Build both architectures
        run: |
          cargo build --locked --release --target aarch64-apple-darwin
          cargo build --locked --release --target x86_64-apple-darwin

      - name: Universal binary
        run: |
          mkdir -p universal

          lipo -create \
            target/aarch64-apple-darwin/release/zapfast \
            target/x86_64-apple-darwin/release/zapfast \
            -output universal/zapfast

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'

      - name: Install native packaging
        run: gem install native-packages --version 0.6.0 --no-document

      - name: App bundle
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p dist/macos-input

          bash packaging/macos/bundle.sh \
            universal/zapfast \
            dist/macos-input/ZapFast.app \
            "$RELEASE_VERSION"

          cp README.md LICENSE dist/macos-input/

      - name: Package, sign and notarize macOS app
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          native-packages build \
            --version "$RELEASE_VERSION" \
            --target macos-universal \
            --defer-recipes \
            --output "$RUNNER_TEMP/macos-packages"

          cp \
            "$RUNNER_TEMP/macos-packages/packages/macos-universal/dmg/"*.dmg \
            dist/

      - name: Verify the notarized release app
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          bash packaging/macos/verify.sh \
            "dist/zapfast-${RELEASE_TAG}-macos-universal.dmg"

      - uses: actions/upload-artifact@v7
        with:
          name: macos-universal
          path: dist/*.dmg
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # Flatpak
  # -------------------------------------------------------------------------
  flatpak:
    name: Flatpak bundle
    needs:
      - prepare
      - build

    runs-on: ubuntu-latest

    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          name: x86_64-unknown-linux-gnu
          path: dist

      - name: Unpack the Linux build
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          tar xzf \
            "dist/zapfast-${RELEASE_TAG}-x86_64-unknown-linux-gnu.tar.gz" \
            -C packaging/flatpak

          mv \
            "packaging/flatpak/zapfast-${RELEASE_TAG}-x86_64-unknown-linux-gnu" \
            packaging/flatpak/built

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/rocks.zapfast.ZapFast.bundle.yml
          bundle: zapfast-${{ needs.prepare.outputs.tag }}-x86_64.flatpak
          cache: false
          upload-artifact: false

      - uses: actions/upload-artifact@v7
        with:
          name: flatpak
          path: "*.flatpak"
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # GitHub Release
  # -------------------------------------------------------------------------
  publish:
    name: GitHub release

    needs:
      - prepare
      - build
      - macos
      - flatpak

    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail

          cd dist
          sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # -------------------------------------------------------------------------
  # Additional packaging workflow
  # -------------------------------------------------------------------------
  packaging:
    name: Additional packaging

    if: |
      !contains(needs.prepare.outputs.tag, '-')

    needs:
      - prepare
      - publish

    uses: ./.github/workflows/packaging.yml

    with:
      version: ${{ needs.prepare.outputs.tag }}

    secrets: inherit
